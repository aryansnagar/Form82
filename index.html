<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form82</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container_one">
        <h2>Form 82</h2>
        <p>Form82 is an automation tool that collects custom HTML form submissions, stores them in a Google Sheet, and email each submission to the publisher's address.
        <br>This is the test form for demo.</p>
    </div>

    <form id="contactForm">
        <!-- <h2>Contact Us</h2> -->

        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Full Name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com" required>

        <label for="message">Message</label>
        <textarea rows="4" id="message" name="message" placeholder="Message" required></textarea>

        <button type="submit" id="submitBtn">Send</button>
        <div id="status"></div>
    </form>

    <script src="script.js"></script>

</body>
</html>
